<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Author Tag -->
    <meta name="author" content="AI Assistant" />
    <!-- Description Tag -->
    <meta
      name="description"
      content="An interactive, adaptive learning platform providing personalized study aids, custom flashcards, complex concept breakdowns, and real-time problem-solving support to help students master any subject."
    />
    <!-- Keywords Tag -->
    <meta
      name="keywords"
      content="study aids, flashcards, learning materials, AI tutor, exam preparation, homework help, educational tools, study guides, interactive learning, academic success"
    />
    <!-- 1. Normalize CSS (Establishes a consistent baseline) -->
    <link rel="stylesheet" href="./assets/vendor/normalize.css" />
    <!-- 2. Custom Stylesheet (Overrides defaults with your own styles) -->
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Title</title>
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="#home">Flashcards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li><a class="nav__link" href="#home">My Decks</a></li>
          <li><a class="nav__link" href="#about">About</a></li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content">
      <section id="home" class="decks">
        <h2 class="decks__title">My Decks</h2>
        <div class="decks__row">
          <ul class="decks__list wrapping-row__display-contents">
            <template id="deck-template">
              <li class="deck deck--color-green">
                <div class="deck__content">
                  <h2 class="deck__title">
                    <a class="deck__link"></a>
                  </h2>
                  <div class="deck__row">
                    <span class="deck__count"></span>
                    <button
                      class="deck__delete-btn"
                      aria-label="Delete this deck"
                      type="button"
                    >
                      <img src="./assets/images/delete.svg" alt="trash can" />
                    </button>
                  </div>
                </div>
              </li>
            </template>
          </ul>
          <button class="decks__new-deck-btn" type="button">+ New Deck</button>
        </div>
      </section>
      <section id="carousel-view" class="carousel" hidden>
        <h2 class="carousel__title"></h2>
        <div class="carousel__row">
          <button
            class="carousel__btn carousel__btn_type_left"
            type="button"
            aria-label="Previous card"
          ></button>
          <div class="carousel__card">
            <p class="carousel__card-text"></p>
          </div>
          <button
            class="carousel__btn carousel__btn_type_right"
            type="button"
            aria-label="Next card"
          ></button>
        </div>
        <button
          class="carousel__btn carousel__btn_type_flip"
          type="button"
          aria-label="Show answer"
        ></button>
      </section>
      <section id="not-found" class="not-found" hidden>
        <h2 class="not-found__title">404 Not Found</h2>
        <p class="not-found__text">
          The page you are looking for does not exist.
        </p>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__text">&copy;2026 Kevin Brown</p>
    </footer>
    <script type="module" src="./assets/js/index.js"></script>
  </body>
</html>
