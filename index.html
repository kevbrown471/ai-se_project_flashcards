<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Author Tag -->
    <meta name="author" content="AI Assistant" />
    <!-- Description Tag -->
    <meta
      name="description"
      content="An interactive, adaptive learning platform providing personalized study aids, custom flashcards, complex concept breakdowns, and real-time problem-solving support to help students master any subject."
    />
    <!-- Keywords Tag -->
    <meta
      name="keywords"
      content="study aids, flashcards, learning materials, AI tutor, exam preparation, homework help, educational tools, study guides, interactive learning, academic success"
    />
    <!-- 1. Normalize CSS (Establishes a consistent baseline) -->
    <!-- 2. Custom Stylesheet (Overrides defaults with your own styles) -->
    <link rel="stylesheet" href="./assets/css/index.css?v=deck-view-media" />
    <link rel="stylesheet" href="./assets/vendor/normalize.css" />
    <link rel="stylesheet" href="./assets/css/page.css" />
    <link rel="stylesheet" href="./assets/css/mobile-bar.css?v=3c4e8dd" />
    <link rel="stylesheet" href="./assets/css/modal.css" />
    <link rel="icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Title</title>
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="#home">Flashcards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li><a class="nav__link" href="#home">My Decks</a></li>
          <li><a class="nav__link" href="#about">About</a></li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content">
      <section id="home" class="gallery">
        <h2 class="gallery__title">My Decks</h2>
        <div class="gallery__row">
          <ul class="gallery__list wrapping-row__display-contents">
            <template id="card-template">
              <li class="card card--color-green">
                <div class="card__content">
                  <h2 class="card__title">
                    <a class="card__link"></a>
                  </h2>
                  <div class="card__row">
                    <span class="card__count"></span>
                    <button
                      class="card__btn card__btn_type_delete"
                      aria-label="Delete this deck"
                      type="button"
                    >
                      <img src="./assets/images/delete.svg" alt="trash can" />
                    </button>
                  </div>
                </div>
              </li>
            </template>
          </ul>
          <button class="gallery__new-deck-btn" type="button">
            + New Deck
          </button>
        </div>
      </section>

      <section id="deck-view" class="gallery" hidden>
        <div class="gallery__header">
          <h2 class="gallery__title"></h2>
          <button class="gallery__practice-btn" type="button">Practice</button>
        </div>
        <div class="gallery__row">
          <ul class="gallery__list wrapping-row__display-contents">
            <template id="flashcard-template">
              <li class="card card--color-green">
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <div class="card__row">
                    <button
                      class="card__flip-btn"
                      aria-label="Flip this card"
                      type="button"
                    ></button>
                    <button
                      class="card__btn card__btn_type_delete"
                      aria-label="Delete this card"
                      type="button"
                    >
                      <img src="./assets/images/delete.svg" alt="trash can" />
                    </button>
                  </div>
                </div>
              </li>
            </template>
          </ul>
          <button
            class="gallery__new-card-btn gallery__new-card-btn_location_deck-view"
            type="button"
          >
            + New Card
          </button>
        </div>
      </section>

      <div id="confirmation-modal" class="modal">
           <div class="modal__container">
             <p class="modal__text">Are you sure you want to delete this image?</p>
            <div class="modal__buttons">
            <button aria-label="Cancel" type="button" class="modal__btn modal__btn_type_cancel"><img src="./assets/images/cancel.svg" alt="Cancel" /></button>
            <button type="button" class="modal__btn modal__btn_type_confirm">Delete</button>
           </div>
          </div>
        </div>

      <section id="carousel-view" class="carousel" hidden>
        <h2 class="carousel__title"></h2>
        <div class="carousel__grid">
          <button
            class="carousel__btn carousel__btn_type_left"
            type="button"
            aria-label="Previous card"
          ></button>
          <div class="carousel__card">
            <p class="carousel__card-text"></p>
          </div>
          <button
            class="carousel__btn carousel__btn_type_right"
            type="button"
            aria-label="Next card"
          ></button>
          <button
            class="carousel__btn carousel__btn_type_flip"
            type="button"
            aria-label="Show answer"
          ></button>
        </div>
      </section>
      <section id="not-found" class="not-found" hidden>
        <h2 class="not-found__title">404 Not Found</h2>
        <p class="not-found__text">
          The page you are looking for does not exist.
        </p>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__text">&copy;2026 Kevin Brown</p>
    </footer>
    <script type="module" src="./assets/js/index.js"></script>
  </body>
</html>
